name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: build-and-test
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set-up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build, test and package
        run: make ci
